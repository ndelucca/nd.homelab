---
# Configuración de la Pi con MainsailOS (impresora 3D). Dos cosas:
#
# 1. TLS. Emite su propio certificado real vía el challenge ACME DNS-01 (deSEC) y
#    sirve la UI de Mainsail sobre HTTPS. DNS-01 solo crea un registro TXT
#    mediante la API de deSEC, así que nada queda expuesto a internet y la Pi no
#    depende del servidor Fedora.
#
# 2. Configuración de Klipper. La despliega desde el repo nd.printer, que es la
#    fuente de verdad, preservando el bloque SAVE_CONFIG que escribe Klipper.
#
# 3. Vigía del enlace USB con la placa. El CH340 de la placa cuelga su lectura
#    cada tanto (EPIPE en el kernel) y dos de esos sin reiniciar Klipper matan
#    la impresión en curso. El vigía registra cada evento con su contexto y
#    repone los buffers con un FIRMWARE_RESTART cuando la máquina está quieta.
#
# SIEMPRE limitar a la impresora; nunca al servidor Fedora:
#   ansible-playbook playbooks/printers.yml -l ndelucca-raspberry-printer
#   ansible-playbook playbooks/printers.yml -l ndelucca-raspberry-printer --tags acme
#   ansible-playbook playbooks/printers.yml -l ndelucca-raspberry-printer --check
#
# Antes de aplicar un cambio de configuración de Klipper, ver el diff:
#   ansible-playbook playbooks/printers.yml -l ndelucca-raspberry-printer \
#     --tags klipper_config --check --diff

- name: Configure the MainsailOS printer
  hosts: printers
  gather_facts: true

  roles:
    # Emitir el cert primero para que mainsail_tls lo encuentre en disco.
    - role: acme
      tags: ['acme', 'tls']
      when: acme_enabled | default(false) | bool

    - role: mainsail_tls
      tags: ['mainsail_tls', 'tls']

    - role: klipper_config
      tags: ['klipper_config', 'klipper']

    - role: klipper_usb_watch
      tags: ['klipper_usb_watch', 'klipper']
