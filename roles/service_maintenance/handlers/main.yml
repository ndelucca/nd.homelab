---
# Prefijado con el rol a propósito: los nombres de handler viven en un namespace
# GLOBAL al play. Si dos roles definen `Daemon-reload`, gana el último cargado y el
# notify del otro dispara el handler ajeno en silencio (verificado). Ver backup/.
- name: Service_maintenance daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
