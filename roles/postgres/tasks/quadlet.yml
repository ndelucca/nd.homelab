---
# Despliega la configuración de Podman Quadlet para PostgreSQL

- name: Deploy PostgreSQL Quadlet .container unit
  ansible.builtin.template:
    src: postgres.container.j2
    dest: "{{ postgres_quadlet_dir }}/{{ postgres_uid }}/{{ postgres_service_name }}.container"
    owner: root
    group: root
    mode: '0644'
  become: true
  notify:
    - Container daemon-reload-user
    # Volúmenes category-less (sin :Z): relabelear a container_file_t:s0 ANTES del restart,
    # o el container nuevo crashea contra la categoría MCS vieja.
    - Container apply selinux context
    - Container restart

# NO se flushean los handlers acá: el paso de service compartido (container_base) los flushea
# DESPUÉS de promover container_base_uid/user/service_name y los paths de SELinux a host facts.
