---
# Variables por defecto del role klipper_config.
#
# Despliega la configuración de Klipper de la impresora desde el repo nd.printer,
# que es la única fuente de verdad. Sobrescribir por grupo en
# inventory/group_vars/printers/ o por host en inventory/host_vars/.

# De dónde sale la configuración. El repo es público, así que se clona por HTTPS
# y no hace falta ninguna credencial en la Pi.
klipper_config_repo: https://github.com/ndelucca/nd.printer.git
klipper_config_ref: main
klipper_config_checkout: "/home/{{ ansible_user }}/nd.printer"
klipper_config_git_update: true

# Qué versión desplegar. Vacío significa leer versions/CURRENT del checkout, que
# es la fuente de verdad de cuál está viva. Fijar un valor acá (ej. "v2") sirve
# para hacer rollback sin tocar el repo.
klipper_config_version: ""

klipper_config_dir: "/home/{{ ansible_user }}/printer_data/config"

# Los archivos que gestiona este role. mainsail.cfg NO está y no debe estar: en
# la Pi es un symlink a ~/mainsail-config/mainsail.cfg, el checkout upstream que
# mantiene el [update_manager mainsail-config] de Moonraker. Lo mismo
# timelapse.cfg. Versionar una copia solo garantiza que derive en silencio.
klipper_config_managed_files:
  - hardware.cfg
  - limits.cfg
  - macros.cfg

# El archivo de mainsail y el nuestro que declara [gcode_macro _CLIENT_VARIABLE],
# que es la única forma de configurar PAUSE / RESUME / CANCEL_PRINT. No se
# despliegan ni se tocan: se LEEN, para verificar que los nombres de variables
# que declaramos sigan siendo los que mainsail.cfg lee. Ver mainsail_contract.yml.
klipper_config_mainsail_file: mainsail.cfg
klipper_config_client_var_file: macros.cfg

# Ese contrato falla en silencio —el default de mainsail vuelve a ganar y nada
# avisa—, así que acá falla ruidoso: el bloque se acaba de desplegar y
# desplegarlo sin efecto es un deploy fallido. El role mainsailos llama al mismo
# archivo con esto en false, porque allá venimos de actualizar el stack entero.
klipper_config_fail_on_mainsail_drift: true

# moonraker.conf va aparte de la lista de arriba, y no por prolijidad: no es
# configuración de Klipper y no se recarga igual. Los tres .cfg de arriba los
# relee la propia Moonraker cuando se le pide `POST /printer/restart`; este
# archivo lo lee Moonraker al ARRANCAR, así que un cambio exige reiniciar el
# servicio — y eso tira abajo, por unos segundos, la API con la que este mismo
# role verifica todo lo demás. De ahí que tenga su propio handler, su propia
# espera y su propio veredicto en verify.yml.
#
# Vaciar esta variable desactiva el manejo. No hace falta para hacer rollback a
# v1 o v2: esas versiones no traen el archivo y la tarea se saltea sola.
klipper_config_moonraker_file: moonraker.conf

# Copia de seguridad, una sola vez (force: false), del moonraker.conf que ya
# estaba en la Pi. Es la única red que hay antes del primer despliegue: hasta
# ahora ese archivo no lo gestionaba nadie, así que su contenido no está en
# ningún repo y sobrescribirlo sin copia sería irreversible.
klipper_config_moonraker_backup: moonraker.conf.predespliegue

# Cuánto esperar a que la API de Moonraker vuelva después de reiniciarla. Más
# corto que la espera de Klipper porque Moonraker arranca en un par de segundos
# y no tiene que hablar con el MCU.
klipper_config_moonraker_retries: 30
klipper_config_moonraker_delay: 2

# 0444 a propósito: Klipper nunca escribe estos archivos, y el modo de solo
# lectura evita que el editor de Mainsail los pise sin pasar por el repo.
# printer.cfg queda en 0644 porque Klipper SÍ lo escribe (bloque SAVE_CONFIG).
klipper_config_file_mode: '0444'
klipper_config_printer_cfg_mode: '0644'

# Prefijo con el que Klipper marca el bloque que escribe solo al final de
# printer.cfg: la malla de cama, el z_offset del probe y los PID. La migración lo
# preserva textualmente.
klipper_config_save_marker: '#*#'

# 127.0.0.1 literal mantiene las peticiones en el camino de confianza de loopback
# de Moonraker, así que no hace falta API key.
klipper_config_moonraker_url: "http://127.0.0.1:7125"
klipper_config_moonraker_api_key: ""
klipper_config_api_headers: >-
  {{ {'X-Api-Key': klipper_config_moonraker_api_key}
     if (klipper_config_moonraker_api_key | length > 0) else {} }}

# Reiniciar Klipper cuando cambie algún archivo, y esperar a que vuelva a ready.
klipper_config_restart: true
klipper_config_ready_retries: 30
klipper_config_ready_delay: 4

klipper_config_services:
  - klipper
  - moonraker
  - nginx
