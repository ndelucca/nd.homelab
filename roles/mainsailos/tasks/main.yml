---
# Punto de entrada del role mainsailos.
# Orquestación liviana sobre los mecanismos de update nativos (API de update de
# Moonraker + apt). El orden importa: hacer backup ANTES de cualquier cambio para
# que todo sea reversible.

- name: Run preflight checks
  ansible.builtin.import_tasks: preflight.yml
  tags: ['mainsailos', 'preflight']

- name: Back up printer data before updating
  ansible.builtin.import_tasks: backup.yml
  tags: ['mainsailos', 'backup']
  when: mainsailos_backup_enabled | bool

- name: Update the Klipper stack via Moonraker
  ansible.builtin.import_tasks: klipper_stack.yml
  tags: ['mainsailos', 'klipper']
  when: mainsailos_update_klipper_stack | bool

- name: Check host/MCU firmware version drift
  ansible.builtin.import_tasks: mcu_check.yml
  tags: ['mainsailos', 'mcu']
  when: mainsailos_update_klipper_stack | bool

# El checkout de mainsail-config se actualiza acá adentro, y con el pueden
# cambiar los nombres de las variables de _CLIENT_VARIABLE que nd.printer
# declara para configurar PAUSE / RESUME / CANCEL_PRINT. Ese acoplamiento no
# falla ruidoso: los macros de mainsail vuelven a sus defaults y nadie avisa.
#
# Es el mismo tipo de deriva que mira mcu_check, y por eso va al lado: dos
# mitades que se actualizan por separado y que hay que volver a contrastar
# despues de tocar una. Acá solo advierte -abortar el update entero por algo que
# no impide imprimir seria peor que el problema-; en klipper_config, donde el
# bloque se acaba de desplegar, falla.
- name: Check that mainsail.cfg still reads the _CLIENT_VARIABLE block
  ansible.builtin.include_role:
    name: klipper_config
    tasks_from: mainsail_contract.yml
  vars:
    klipper_config_fail_on_mainsail_drift: false
  tags: ['mainsailos', 'mainsail_contract']
  when: mainsailos_update_klipper_stack | bool

- name: Upgrade OS packages
  ansible.builtin.import_tasks: apt.yml
  tags: ['mainsailos', 'apt']
  when: mainsailos_apt_upgrade | bool

- name: Reboot if the OS requires it
  ansible.builtin.import_tasks: reboot.yml
  tags: ['mainsailos', 'reboot']

- name: Verify services and report versions
  ansible.builtin.import_tasks: verify.yml
  tags: ['mainsailos', 'verify']
