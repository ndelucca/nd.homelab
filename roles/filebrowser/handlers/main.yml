---
# Prefijado con el rol a propósito: los nombres de handler viven en un namespace
# GLOBAL al play. Si dos roles definen `Daemon-reload`, gana el último cargado y el
# notify del otro dispara el handler ajeno en silencio (verificado). Ver backup/.
- name: Filebrowser daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Restart filebrowser
  ansible.builtin.systemd:
    name: "{{ filebrowser_service_name }}"
    state: restarted
  become: true

- name: Filebrowser apply selinux context
  ansible.builtin.command: "restorecon -Rv {{ item }}"
  become: true
  loop:
    - "{{ filebrowser_install_dir }}/filebrowser"
    - "{{ filebrowser_working_dir }}"
    - "{{ filebrowser_root_dir }}"
  changed_when: false
