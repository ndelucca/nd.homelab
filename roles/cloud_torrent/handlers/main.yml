---
# Prefijado con el rol a propósito: los nombres de handler viven en un namespace
# GLOBAL al play. Si dos roles definen `Daemon-reload`, gana el último cargado y el
# notify del otro dispara el handler ajeno en silencio (verificado). Ver backup/.
- name: Cloud_torrent daemon-reload
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Restart cloud-torrent
  ansible.builtin.systemd:
    name: "{{ cloud_torrent_service_name }}"
    state: restarted
  become: true

- name: Cloud_torrent apply selinux context
  ansible.builtin.command: "restorecon -Rv {{ item }}"
  become: true
  loop:
    - "{{ cloud_torrent_install_dir }}/cloud-torrent"
    - "{{ cloud_torrent_working_dir }}"
    - "{{ cloud_torrent_downloads_dir }}"
  changed_when: false
