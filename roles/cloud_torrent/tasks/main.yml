---
- name: Include preflight checks
  ansible.builtin.import_tasks: preflight.yml
  tags: ['cloud_torrent', 'preflight']

- name: Install Cloud Torrent binary
  ansible.builtin.import_tasks: install.yml
  tags: ['cloud_torrent', 'install']

# Antes del service: el unit no puede arrancar bien sin la config del motor, que
# es la única fuente del directorio de descargas.
- name: Configure engine settings
  ansible.builtin.import_tasks: config.yml
  tags: ['cloud_torrent', 'config']

- name: Configure systemd service
  ansible.builtin.import_tasks: service.yml
  tags: ['cloud_torrent', 'service']

- name: Configure SELinux
  ansible.builtin.import_tasks: selinux.yml
  tags: ['cloud_torrent', 'selinux']
  when: cloud_torrent_manage_selinux | bool
