---
# Instala / actualiza el binario de Cloud Torrent. Consciente de la versión e
# idempotente: solo re-descarga cuando la versión del binario instalado difiere de
# cloud_torrent_version. La sola presencia NO alcanza — subir la versión/sha
# pineada en defaults debe disparar una reinstalación de verdad.

- name: Check if Cloud Torrent is already installed
  ansible.builtin.stat:
    path: "{{ cloud_torrent_install_dir }}/cloud-torrent"
  register: cloud_torrent_binary

- name: Get installed Cloud Torrent version
  ansible.builtin.command: "{{ cloud_torrent_install_dir }}/cloud-torrent --version"
  register: cloud_torrent_installed_raw
  changed_when: false
  failed_when: false
  # Sonda read-only: DEBE correr también en --check. Si se saltea, la versión instalada queda
  # vacía y `cloud_torrent_needs_install` da true por falso positivo, metiendo al dry-run en el
  # camino de descarga (donde el tempfile sí se saltea y el get_url revienta).
  check_mode: false
  when: cloud_torrent_binary.stat.exists

- name: Normalize installed vs target Cloud Torrent versions
  ansible.builtin.set_fact:
    cloud_torrent_current_version: '{{ ((cloud_torrent_installed_raw.stdout | default("")) ~ (cloud_torrent_installed_raw.stderr | default(""))) | regex_search("[0-9]+\.[0-9]+\.[0-9]+") | default("", true) }}'
    cloud_torrent_target_version: '{{ cloud_torrent_version | regex_search("[0-9]+\.[0-9]+\.[0-9]+") | default("", true) }}'

- name: Decide whether Cloud Torrent needs (re)install
  ansible.builtin.set_fact:
    cloud_torrent_needs_install: "{{ (not cloud_torrent_binary.stat.exists) or (cloud_torrent_target_version != cloud_torrent_current_version) }}"

- name: Report Cloud Torrent version decision
  ansible.builtin.debug:
    msg: >-
      Cloud Torrent installed={{ cloud_torrent_current_version | default('none') }}
      target={{ cloud_torrent_target_version }}
      -> {{ 'installing/updating' if cloud_torrent_needs_install else 'up to date' }}

# Gateado en needs_install: un host que ya está en la versión pineada no tiene por
# qué exigir el checksum, y así el assert sólo salta cuando de verdad hay que bajar.
- name: Assert a checksum is pinned before downloading
  ansible.builtin.assert:
    that:
      - cloud_torrent_sha256 | length == 64
    fail_msg: >-
      cloud_torrent_sha256 está vacío o no es un SHA256: no hay nada con qué
      verificar {{ cloud_torrent_download_url }}. Tomalo del
      nd.cloud.torrent_{{ cloud_torrent_version }}_checksums.txt del release y
      pinealo en roles/cloud_torrent/defaults/main.yml.
    success_msg: "Checksum pineado para Cloud Torrent {{ cloud_torrent_version }}"
  when: cloud_torrent_needs_install

- name: Create temporary download directory
  ansible.builtin.tempfile:
    state: directory
    suffix: _cloud_torrent_download
  register: cloud_torrent_download_dir
  when: cloud_torrent_needs_install

- name: Download Cloud Torrent binary
  ansible.builtin.get_url:
    url: "{{ cloud_torrent_download_url }}"
    dest: "{{ cloud_torrent_download_dir.path }}/cloud-torrent.gz"
    checksum: "sha256:{{ cloud_torrent_sha256 }}"
    mode: '0644'
  # `tempfile` no corre en --check: sin el guard del path, un dry-run con update pendiente
  # revienta acá. Mismo patrón que el cleanup de más abajo.
  when: cloud_torrent_needs_install and cloud_torrent_download_dir.path is defined

- name: Extract Cloud Torrent binary
  ansible.builtin.command:
    cmd: gunzip cloud-torrent.gz
    chdir: "{{ cloud_torrent_download_dir.path }}"
    creates: "{{ cloud_torrent_download_dir.path }}/cloud-torrent"
  when: cloud_torrent_needs_install and cloud_torrent_download_dir.path is defined

- name: Copy binary to installation directory
  ansible.builtin.copy:
    src: "{{ cloud_torrent_download_dir.path }}/cloud-torrent"
    dest: "{{ cloud_torrent_install_dir }}/cloud-torrent"
    remote_src: true
    owner: root
    group: root
    mode: '0755'
  become: true
  notify: Restart cloud-torrent
  when: cloud_torrent_needs_install and cloud_torrent_download_dir.path is defined

- name: Clean up temporary download directory
  ansible.builtin.file:
    path: "{{ cloud_torrent_download_dir.path }}"
    state: absent
  when: cloud_torrent_download_dir is defined and cloud_torrent_download_dir.path is defined

- name: Verify Cloud Torrent binary is executable
  ansible.builtin.command: "{{ cloud_torrent_install_dir }}/cloud-torrent --version"
  register: cloud_torrent_version_check
  changed_when: false
  failed_when: false
  # Sonda read-only, igual que la de más arriba: sin esto en --check se saltea, el
  # registro queda vacío y el debug de abajo cae al fallback, reportando la versión
  # *objetivo* como si estuviera instalada.
  check_mode: false

- name: Display Cloud Torrent version
  ansible.builtin.debug:
    # El fork imprime --version por stdout (el upstream lo hacía por stderr), así
    # que se leen los dos: con `stderr | default(...)` a secas el mensaje salía
    # vacío, porque un stderr vacío está definido y el default no dispara.
    msg: >-
      Installed Cloud Torrent version:
      {{ ((cloud_torrent_version_check.stdout | default('')) ~ (cloud_torrent_version_check.stderr | default('')))
         | trim | default(cloud_torrent_version, true) }}
