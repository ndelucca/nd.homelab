---
# El archivo de entorno con la URL de la base. Lo lee systemd (EnvironmentFile= en el
# Quadlet) y se lo pasa al contenedor como NDM_DB_URL: la password nunca queda en la unit,
# que es 0644 y la ve cualquiera. Mismo patron que initdb.env del rol postgres y desec.env
# del rol acme.
- name: Deploy the database environment file
  ansible.builtin.template:
    src: nd_market.env.j2
    dest: "{{ nd_market_secrets_dir }}/nd_market.env"
    owner: "{{ nd_market_user }}"
    group: "{{ nd_market_group }}"
    mode: '0600'
  become: true
  no_log: true
  notify:
    - Container restart
