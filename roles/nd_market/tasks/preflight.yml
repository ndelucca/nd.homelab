---
- name: Common container preflight (Fedora, uid)
  ansible.builtin.include_role:
    name: container_base
    tasks_from: preflight
  vars:
    container_base_user: "{{ nd_market_user }}"

- name: Map the resolved UID to nd_market_uid
  ansible.builtin.set_fact:
    nd_market_uid: "{{ container_base_uid }}"

# El Quadlet usa Pull=newer contra el registry de Forgejo. Si el paquete es privado, sin login el
# pull falla en SILENCIO y la unit no arranca. Si el token de lectura esta en el vault, el login lo
# hace Ansible acá; si no, lo hace ndelucca a mano (docs/BOOTSTRAP.md §4b) y abajo solo se avisa.
# Al 14/10/2026 el paquete nd.market es PUBLICO (el pull anda sin auth.json en el host), asi que
# el aviso de abajo es informativo hasta que eso cambie.
- name: Log podman in to the container registry (vault_forgejo_registry_pull_token)
  ansible.builtin.command:
    cmd: "podman login --username {{ nd_market_registry_user }} --password-stdin {{ nd_market_image.split('/')[0] }}"
    stdin: "{{ nd_market_registry_token }}"
  become: true
  become_user: "{{ nd_market_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ nd_market_uid }}"
  when: nd_market_registry_token | length > 0
  changed_when: false
  no_log: true

- name: Check whether podman is logged in to the container registry
  ansible.builtin.command: "podman login --get-login {{ nd_market_image.split('/')[0] }}"
  become: true
  become_user: "{{ nd_market_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ nd_market_uid }}"
  register: nd_market_registry_login
  changed_when: false
  failed_when: false
  check_mode: false

# Warning (no un assert que aborte): un login faltante NO debe bloquear el converge del resto de los
# roles. Surfacea el mensaje claro —convirtiendo el 502 silencioso en algo visible— y sigue; el
# propio nd_market igual fallará más adelante al pullear si el login falta, ya con contexto.
- name: Warn clearly if podman is NOT logged in to the registry (Pull=newer needs it)
  ansible.builtin.debug:
    msg: >-
      WARNING: podman NO está logueado al registry {{ nd_market_image.split('/')[0] }} — el
      Pull=newer de nd_market fallará (la imagen no se actualiza y la unit no arranca tras un deploy).
      Logueate a mano como {{ nd_market_user }} en el host (ver docs/BOOTSTRAP.md §4b):
      podman login {{ nd_market_image.split('/')[0] }} -u ndelucca
  when: nd_market_registry_login.rc != 0

# Sin password no hay NDM_DB_URL y la app no arranca. Se corta aca, con nombre, en vez de
# dejar que la unit entre en un loop de Restart=on-failure cada 30 segundos.
- name: Ensure the database password is available (vault_postgres_app_password)
  ansible.builtin.assert:
    that:
      - nd_market_db_password | length > 0
    fail_msg: >-
      nd_market_db_password esta vacia: services.yml tiene que mapearla a
      vault_postgres_app_password (es el mismo rol de base que gestiona el rol postgres).

- name: Ensure base and data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nd_market_user }}"
    group: "{{ nd_market_group }}"
    mode: '0750'
  become: true
  loop:
    - "{{ nd_market_base_dir }}"
    - "{{ nd_market_data_dir }}"

- name: Ensure the secrets directory exists (host side only, never mounted)
  ansible.builtin.file:
    path: "{{ nd_market_secrets_dir }}"
    state: directory
    owner: "{{ nd_market_user }}"
    group: "{{ nd_market_group }}"
    mode: '0700'
  become: true
